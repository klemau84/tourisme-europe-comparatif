name: Actualisation des données touristiques

on:
  workflow_dispatch:
  schedule:
    - cron: "20 6 5 1,4,7,10 *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas
      - run: python scripts/update_data.py
      - name: Commit des données modifiées
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/comparatif_pays.csv data/metadonnees.csv
          git diff --cached --quiet || git commit -m "Actualisation Eurostat"
          git push
